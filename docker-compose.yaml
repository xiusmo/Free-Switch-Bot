services:
  freeswitch:
    build:
      context: .
      args:
        TOKEN: pat_bujV42y6vPTjaF6SyPXya9GY
    container_name: freeswitch
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    ulimits:
      nofile:
        soft: 65000
        hard: 65000
    environment:
      - EXT_IP=${EXT_IP:-auto-nat}
      - FS_PASSWORD=${FS_PASSWORD:-FSB0t_3SL_pw_20250812_abcDEF1234}
    volumes:
      - ./conf:/etc/freeswitch
      - ./data:/var/lib/freeswitch
      - ./logs:/var/log/freeswitch
      - ./recordings:/recordings
      - ./mvp/wav-example.wav:/var/lib/freeswitch/recordings/wav-example.wav:ro
      - ./data:/shared:ro
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "5061:5061/tcp"
      - "5061:5061/udp"
      - "5080:5080/tcp"
      - "5080:5080/udp"
      - "5081:5081/tcp"
      - "5081:5081/udp"
      - "8081:8081/tcp"      # mod_audio_stream WebSocket
      - "16384-16484:16384-16484/udp"  # RTP 范围（与 vars.xml 保持一致）

  mvp:
    build:
      context: .
      dockerfile: mvp/Dockerfile
    container_name: fs-mvp
    restart: unless-stopped
    environment:
      - PORT=8080
      - FS_HOST=freeswitch
      - FS_PORT=8021
      - FS_PASSWORD=${FS_PASSWORD:-FSB0t_3SL_pw_20250812_abcDEF1234}
      - AUDIO_WS_HOST=fs-mvp
      - AUDIO_WS_PORT=8081
    ports:
      - "8080:8080"
    depends_on:
      - freeswitch
    volumes:
      - ./data:/shared:rw

networks:
  default:
    name: freeswitch-net
