services:
  freeswitch:
    build:
      context: .
      args:
        TOKEN: pat_bujV42y6vPTjaF6SyPXya9GY
    container_name: freeswitch
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    ulimits:
      nofile:
        soft: 65000
        hard: 65000
    environment:
      - EXT_IP=${EXT_IP:-auto-nat}
      - FS_PASSWORD=${FS_PASSWORD:-FSB0t_3SL_pw_20250812_abcDEF1234}
    volumes:
      - ./conf:/etc/freeswitch
      - ./data:/var/lib/freeswitch
      - ./logs:/var/log/freeswitch
      - ./recordings:/recordings
      - ./mvp/wav-example.wav:/var/lib/freeswitch/recordings/wav-example.wav:ro
      - ./data:/shared:ro
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "5061:5061/tcp"
      - "5061:5061/udp"
      - "5080:5080/tcp"
      - "5080:5080/udp"
      - "5081:5081/tcp"
      - "5081:5081/udp"
      - "8081:8081/tcp"      # mod_audio_stream WebSocket
      - "16384-16484:16384-16484/udp"  # RTP 范围（与 vars.xml 保持一致）

  mvp:
    build:
      context: .
      dockerfile: mvp/Dockerfile
    container_name: fs-mvp
    restart: unless-stopped
    environment:
      - PORT=8080
      - FS_HOST=freeswitch
      - FS_PORT=8021
      - FS_PASSWORD=${FS_PASSWORD:-FSB0t_3SL_pw_20250812_abcDEF1234}
      - AUDIO_WS_HOST=fs-mvp
      - AUDIO_WS_PORT=8081
      - QWEN_OMNI_ENABLED=${QWEN_OMNI_ENABLED:-true}
      - QWEN_OMNI_API_KEY=${QWEN_OMNI_API_KEY:-sk-a8fb7798b99e458f8a0ecf43684466ff}
      - QWEN_OMNI_MODEL=${QWEN_OMNI_MODEL:-qwen-omni-turbo-realtime-latest}
      - QWEN_OMNI_VOICE=${QWEN_OMNI_VOICE:-Chelsie}
      - QWEN_OMNI_LANGUAGE=${QWEN_OMNI_LANGUAGE:-zh}
      - QWEN_OMNI_VAD_MODE=${QWEN_OMNI_VAD_MODE:-true}
      - QWEN_OMNI_WEBSOCKET_URL=${QWEN_OMNI_WEBSOCKET_URL:-wss://dashscope.aliyuncs.com/api/v1/apps/omni/realtime}
    ports:
      - "8080:8080"
    depends_on:
      - freeswitch
    volumes:
      - ./data:/shared:rw

  audio-bridge:
    build:
      context: ./audio-bridge-service
    container_name: audio-bridge
    restart: unless-stopped
    environment:
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=8082
      - MVP_WS_HOST=fs-mvp
      - MVP_WS_PORT=8081
      - RTVC_WS_HOST=realtimevoicechat
      - RTVC_WS_PORT=8000
      - RTVC_SAMPLE_RATE=16000
      - LOG_LEVEL=INFO
      - DEBUG=${DEBUG:-false}
      - SESSION_TIMEOUT=300
      - MAX_SESSIONS=10
    ports:
      - "8082:8082"
    depends_on:
      - mvp
    volumes:
      - /tmp/audio_debug:/tmp/audio_debug


networks:
  default:
    name: freeswitch-net
